<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>World Tour Tacker V02</title>
</head>
<body>
    <div class="main-container">
        <!-- Main vertical red area -->
        <div class="title-container">
            <h1>THE FINALS | World Tour Tracker</h1>
        </div>

        <div class="line"></div>

        <!-- Inputting and Submiiting data -->
        <form id="form">
            <div class="select-container" >
                <select name="stadium" id="stadium" required>
                    <option value="">STADIUM</option>
                    <option value="NOZOMI/CITADEL">NOZOMI/CITADEL</option>
                    <option value="Las Vegas Stadium">Las Vegas Stadium</option>
                    <option value="Bernal">Bernal</option>
                    <option value="Fortune Stadium">Fortune Stadium</option>
                    <option value="Kyoto">Kyoto</option>
                    <option value="SYS$HORIZON">SYS$HORIZON</option>
                    <option value="Las Vegas">Las Vegas</option>
                    <option value="Skyway Stadium">Skyway Stadium</option>
                    <option value="Seoul">Seoul</option>
                    <option value="Monaco">Monaco</option>
                    <option value="Practice Range">Practice Range</option>
                </select>

                <select name="class" id="class" required>
                    <option value="">CLASS</option>
                    <option value="Light">Light</option>
                    <option value="Medium">Medium</option>
                    <option value="Heavy">Heavy</option>
                </select>

                <select name="placement" id="placement" required>
                    <option value="">PLACEMENT</option>
                    <option value="first">1st</option>
                    <option value="second">2nd</option>
                    <option value="third">3rd</option>
                    <option value="fourth">4th</option>
                    <option value="fifth">5th</option>
                    <option value="sixth">6th</option>
                    <option value="seventh">7th</option>
                    <option value="eighth">8th</option>
                </select>
            </div>

            <div class="flex-container">
                <div class="input-container">
                    <div class="stats">
                        <label for="elims">E</label>
                        <input id="elims" name="elims" type="number" required>
                    </div>
                    <div class="stats">
                        <label>A</label>
                        <input id="assists" name="assists" type="number" required>
                    </div>
                    <div class="stats">
                        <label>D</label>
                        <input id="deaths" name="deaths" type="number" required>
                    </div>
                    <div class="stats">
                        <label>R</label>
                        <input id="revives" name="revives" type="number" required>
                    </div>
                </div>
                <div class="checkBox-container">
                    <h3>WEAPONS USED (MAX 5)</h3>
                    <div class="dynamic-container" id="favorite-weapon">
                        <!-- div is populated with checkboxes depending on what class is selected -->
                        <h3>*SELECT A CLASS*</h3>
                    </div>
                </div>
            </div>
            

            <div class="button-container">
                <button type="submit" class="submit-btn">ADD STATS</button>
            </div>
        </form>

        <div class="line"></div>

        <!-- Data Summary - Graphs and stats -->
        <div>
            <div class="title-container">
                <h1>SUMMARY</h1>
            </div>

            <div class="line"></div>

            <div class="stats-container">
                <h3>
                    STATS
                </h3>
                <div id="summary"></div>
                 <div class="stats-grid-4col">
                    <div class="elims">
                        <h3>Eliminations</h3>
                        <div id="elims">20</div>
                    </div>
                    <div class="assists">
                        <h3>Assists</h3>
                        <div id="assists">2</div>
                    </div>
                    <div class="deaths">
                        <h3>Deaths</h3>
                        <div id="deaths">2</div>
                    </div>
                    <div class="revives">
                        <h3>Revives</h3>
                        <div id="revives">2</div>
                    </div>
                </div>
                <div class="line"></div>
                <div class="stats-grid-4col">
                    <div class="kd">
                        <h3>K/D</h3>
                        <div id="kd">2.1</div>
                    </div>
                    <div class="kda">
                        <h3>KDA</h3>
                        <div id="kda">11.0</div>
                    </div>
                    <div class="kpg">
                        <h3>KPG</h3>
                        <div id="kpg">4.0</div>
                    </div>
                    <div class="win-rate">
                        <h3>WIN RATE</h3>
                        <div id="win-rate">50%</div>
                    </div>
                 </div>
                 <div class="line"></div>
                 <div class="stats-grid-3col">
                    <div class="fav-Map">
                        <h3>FAV MAP</h3>
                        <div id="fav-map">KYOTO</div>
                    </div>
                    <div class="fav-Class">
                        <h3>FAV CLASS</h3>
                        <div id="fav-class">HEAVY</div>
                    </div>
                    <div class="fav-Weapon">
                        <h3>FAV WEAPON</h3>
                        <div id="fav-weapon">M60</div>
                    </div>
                 </div>

                 <div class="line"></div>
            </div>

            <!-- Spot for cool graphs to see stats visually. Using chart.js? -->
            <div>
                
            </div>

        </div>
    </div>

    <script src="events.js"></script>
</body>
</html>
