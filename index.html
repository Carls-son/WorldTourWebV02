<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>World Tour Tacker V02</title>
</head>
<body>
    <div class="main-container">
        <!-- Main vertical red area -->
        <div class="title-container">
        <h1>THE FINALS | World Tour Tracker</h1>
        </div>

        <div class="line"></div>

        <!-- Inputting and Submiiting data -->
        <form id="form">
            <div class="select-container">
                <select name="stadium" id="stadium">
                    <option value="">STADIUM</option>
                        <option value="NOZOMI/CITADEL">NOZOMI/CITADEL</option>
                        <option value="Las Vegas Stadium">Las Vegas Stadium</option>
                        <option value="Bernal">Bernal</option>
                        <option value="Fortune Stadium">Fortune Stadium</option>
                        <option value="Kyoto">Kyoto</option>
                        <option value="SYS$HORIZON">SYS$HORIZON</option>
                        <option value="Las Vegas">Las Vegas</option>
                        <option value="Skyway Stadium">Skyway Stadium</option>
                        <option value="Seoul">Seoul</option>
                        <option value="Monaco">Monaco</option>
                        <option value="Practice Range">Practice Range</option>
                </select>

                <select name="class" id="class">
                    <option value="">CLASS</option>
                        <option value="Light">Light</option>
                        <option value="Medium">Medium</option>
                        <option value="Heavy">Heavy</option>
                </select>

                <select name="placement" id="placement">
                    <option value="">PLACEMENT</option>
                        <option value="first">1st</option>
                        <option value="second">2nd</option>
                        <option value="third">3rd</option>
                        <option value="fourth">4th</option>
                        <option value="fifth">5th</option>
                        <option value="sixth">6th</option>
                        <option value="seventh">7th</option>
                        <option value="eighth">8th</option>
                </select>
            </div>

            <div class="flex-container">
                <div class="input-container">
                    <div class="stats">
                        <label for="elims">E</label>
                        <input id="elims" name="elims" type="number" required>
                    </div>
                    <div class="stats">
                        <label>A</label>
                        <input id="assists" name="assists" type="number" required>
                    </div>
                    <div class="stats">
                        <label>D</label>
                        <input id="deaths" name="deaths" type="number" required>
                    </div>
                    <div class="stats">
                        <label>R</label>
                        <input id="revives" name="revives" type="number" required>
                    </div>
                </div>
                <!-- Num of checkboxes based on Class -->
                <div class="checkBox-container">
                    <h3>WEAPONS USED (MAX 5)</h3>
                    <div class="dynamic-container" id="favorite-weapon">
                        <!-- Populate this div with checkboxes depending on what class is selected -->
                        <h3>SELECT A CLASS</h3>
                    </div>
                </div>
            </div>
            

            <div class="button-container">
                <button type="submit" class="submit-btn">ADD STATS</button>
            </div>
        </form>

        <div class="line"></div>

        <!-- Data Summary - Graphs and stats -->
        <div>
            <h2>SUMMARY</h2>
            <div>
                <h2>GRAPH</h2>
            </div>

            <div>
                <h3>
                    STATS
                </h3>
                <div id="summary"></div>
            </div>

        </div>
    </div>

    <script src="events.js"></script>
</body>
</html>
