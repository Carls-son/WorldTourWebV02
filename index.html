<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>World Tour Tacker V02</title>
</head>
<body>
    <div class="main-container">
        <!-- Main vertical red area -->
        <div class="title-container">
            <h1>THE FINALS | World Tour Tracker</h1>
        </div>

        <div class="line"></div>

        <!-- Inputting and Submiiting data -->
        <form id="form" class="form-container">
            <div class="select-container" >
                <select name="stadium" id="stadium" required>
                    <option value="">STADIUM</option>
                    <option value="NOZOMI/CITADEL">NOZOMI/CITADEL</option>
                    <option value="Las Vegas Stadium">Las Vegas Stadium</option>
                    <option value="Bernal">Bernal</option>
                    <option value="Fortune Stadium">Fortune Stadium</option>
                    <option value="Kyoto">Kyoto</option>
                    <option value="SYS$HORIZON">SYS$HORIZON</option>
                    <option value="Las Vegas">Las Vegas</option>
                    <option value="Skyway Stadium">Skyway Stadium</option>
                    <option value="Seoul">Seoul</option>
                    <option value="Monaco">Monaco</option>
                </select>

                <select name="class" id="class" required>
                    <option value="">CLASS</option>
                    <option value="Light">Light</option>
                    <option value="Medium">Medium</option>
                    <option value="Heavy">Heavy</option>
                </select>

                <select name="placement" id="placement" required>
                    <option value="">PLACEMENT</option>
                    <option value="first">1st</option>
                    <option value="second">2nd</option>
                    <option value="third">3rd</option>
                    <option value="fourth">4th</option>
                    <option value="fifth">5th</option>
                    <option value="sixth">6th</option>
                    <option value="seventh">7th</option>
                    <option value="eighth">8th</option>
                </select>
            </div>

            <div class="flex-container">
                <div class="input-container">
                    <h3>GAME STATS</h3>
                    <div class="stats">
                        <label for="elims">E</label>
                        <input id="elims" name="elims" type="number" required>
                    </div>
                    <div class="stats">
                        <label>A</label>
                        <input id="assists" name="assists" type="number" required>
                    </div>
                    <div class="stats">
                        <label>D</label>
                        <input id="deaths" name="deaths" type="number" required>
                    </div>
                    <div class="stats">
                        <label>R</label>
                        <input id="revives" name="revives" type="number" required>
                    </div>
                </div>
                <div class="vertical-line"></div>
                <div class="checkBox-container">
                    <h3>WEAPONS USED (MAX 5)</h3>
                    <div class="dynamic-container" id="favorite-weapon">
                        <!-- div is populated with checkboxes depending on what class is selected -->
                    </div>
                </div>
            </div>
            

            <div class="button-container">
                <button type="submit" class="submit-btn">ADD STATS</button>
            </div>
        </form>

        <div class="line"></div>

        <!-- Data Summary - Graphs and stats -->
        <div>
            <div class="title-container">
                <h1>SUMMARY</h1>
            </div>

            <div class="line"></div>

            <div class="stats-container">
                <h3>
                    STATS
                </h3>
                 <div class="stats-grid-4col">
                    <div>
                        <h3>Eliminations</h3>
                        <div id="elimsSum" class="stats-displayed-numbers"></div>
                    </div>
                    <div>
                        <h3>Assists</h3>
                        <div id="assistsSum" class="stats-displayed-numbers"></div>
                    </div>
                    <div>
                        <h3>Deaths</h3>
                        <div id="deathsSum" class="stats-displayed-numbers"></div>
                    </div>
                    <div>
                        <h3>Revives</h3>
                        <div id="revivesSum" class="stats-displayed-numbers"></div>
                    </div>
                </div>
                <div class="line"></div>
                <div class="stats-grid-4col">
                    <div>
                        <h3>K/D</h3>
                        <div id="kd" class="stats-displayed-numbers"></div>
                    </div>
                    <div>
                        <h3>KDA</h3>
                        <div id="kda" class="stats-displayed-numbers"></div>
                    </div>
                    <div>
                        <h3>KPG</h3>
                        <div id="kpg" class="stats-displayed-numbers"></div>
                    </div>
                    <div>
                        <h3>WIN RATE</h3>
                        <div id="win-rate" class="stats-displayed-numbers"></div>
                    </div>
                 </div>
                 <div class="line"></div>
                 <div class="stats-grid-4col">
                    <div>
                        <h3>FAV MAP</h3>
                        <div id="fav-stadium" class="stats-displayed-numbers"></div>
                    </div>
                    <div>
                        <h3>FAV CLASS</h3>
                        <div id="fav-class" class="stats-displayed-numbers"></div>
                    </div>
                    <div>
                        <h3>FAV WEAPON</h3>
                        <div id="fav-weapon" class="stats-displayed-numbers"></div>
                    </div>
                    <div>
                        <h3>WT POINTS</h3>
                        <div id="points-earned" class="stats-displayed-numbers"></div>
                    </div>
                 </div>

                 <div class="line"></div>
            </div>

            <!-- Spot for cool graphs to see stats visually. Using chart.js? -->
            <div>
                
            </div>

        </div>
    </div>

    <script src="events.js"></script>
</body>
</html>
